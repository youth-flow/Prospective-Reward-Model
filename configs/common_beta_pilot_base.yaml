# Eight-section materialization source for configs/common_beta_pilot.yaml.
# This file is consumed by the existing Phase-1 materializer only.  The
# Phase-2 pilot evidence contract lives exclusively in the overlay.
run:
  name: common-beta-pilot-materialization-v2
  seeds:
    - 20260801
    - 20260802
    - 20260803
  num_prompts: 2048
  split_sizes: {train: 1536, validation: 256, test: 256}

data:
  prompt_dataset: allenai/multipref
  prompt_revision: 12910233a0238a997ebe425656e9dfed7b0ff031
  num_candidates: 4
  prompt_eligibility: policy_chat_template_tokens_lte_max_prompt_tokens_before_seeded_shuffle

policy:
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  dtype: float32
  max_prompt_tokens: 1024
  max_response_tokens: 256
  sampling:
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    min_new_tokens: 0
    repetition_penalty: 1.0
  lora_rank: 4
  lora_alpha: 4
  lora_dropout: 0.0
  lora_layers: [20, 21, 22, 23]
  lora_modules: [q_proj, v_proj]
  trainable_tangent_parameters: lora_B_only
  fixed_lora_a:
    mode: frozen_global
    initialization_seed: 946081152281754541
    expected_sha256: a2b5804109396f76b96cde98d1e2060f175a47724b1ca9fef317c7a10cb9a838
    source_seed: 20260722
    source_named_stream: policy_lora_a
    source_config: configs/main.yaml
    source_config_hash: ae5d628ee47ff74a1fa2b89478c40b4fdd289935d8cf58dcbcf98b42f69a0df6
    source_artifact_metadata_sha256: 8ec7ca893a7c93d4bbfac0b71b829b37ec63af3ca0c7a9496465ed60815b155f
    source_seed_excluded_from_phase2: true

oracle:
  model: Skywork/Skywork-Reward-V2-Qwen3-0.6B
  revision: 8c14a4e9e6321deaf572544339b16b8d6bbe8886
  dtype: float32
  transform: robust_center_scale_then_tanh
  robust_scale: scaled_mad
  robust_scale_floor: 1.0e-6
  probability_floor: 0.25
  transform_calibration:
    mode: frozen_global
    b: -4.500244140625
    tau: 2.7715682983398438
    aggregation_rule: componentwise_median
    source_split: train
    source_config: configs/main.yaml
    source_config_hash: ae5d628ee47ff74a1fa2b89478c40b4fdd289935d8cf58dcbcf98b42f69a0df6
    source_seeds_excluded_from_phase2: true
    source_artifacts:
      - seed: 20260722
        metadata_sha256: 8ec7ca893a7c93d4bbfac0b71b829b37ec63af3ca0c7a9496465ed60815b155f
      - seed: 20260723
        metadata_sha256: 4dcd84ba5be64ac7ddc0c8f6caee43ed857e2d735273382e26c388184d2991c8
      - seed: 20260724
        metadata_sha256: 84b9d89fa76555e34c7e3fa840a2873e32b91f1378991a2a3f2cf9fa42c7451d
      - seed: 20260725
        metadata_sha256: 5061881856516d61dcb20bac8a9240aacbf6300f1d6d136fb1f15258e2b0078a
      - seed: 20260726
        metadata_sha256: fdf8b717f7360ba3019ef56af56d07bfe6ee00d6d9aff2836fbf7f249f201b97

annotations:
  scheme: geometric_randomized_truncation
  gamma: 0.9

objective:
  beta: 1.0
  damping_relative_to_mean_fisher_diagonal: 0.001
  damping_sensitivity_multipliers: [0.1, 1.0, 10.0]
  pcg_dtype: float64
  pcg_tolerance: 1.0e-5
  pcg_max_iterations: 8192

reward_model:
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  dtype: float32
  parameterization: frozen_backbone_linear_head
  feature_pooling: last_response_token
  linear_head_bias: false
  outer_steps: 720
  refresh_dual_every_steps: 1
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 0.0
  microbatch_size: 64
  max_grad_norm: 1.0

evaluation:
  heldout_moment: per_prompt_unbiased_covariance
  kl_budget: 0.01
  kl_relative_tolerance: 0.05
  kl_probe_candidates: 16
  rollout_candidates_per_prompt: 4
  report_pairwise_accuracy: true
  paired_bootstrap_resamples: 10000
  paired_bootstrap_seed: 20260801
