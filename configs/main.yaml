protocol: prorm_exact_delta_v1

run:
  name: prorm-main
  seeds: [20261001, 20261002, 20261003]
  prompt_split_seed: 20261000
  num_prompts: 4096
  split_sizes: {train: 3072, validation: 512, test: 512}

data:
  prompt_dataset: allenai/multipref
  prompt_revision: 12910233a0238a997ebe425656e9dfed7b0ff031
  num_candidates: 6
  edge_construction: all_unordered_pairs
  prompt_overlength: exclude_before_sampling

policy:
  model: Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  dtype: float32
  max_prompt_tokens: 512
  max_response_tokens: 256
  sampling:
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    min_new_tokens: 0
    repetition_penalty: 1.0
  lora_rank: 4
  lora_alpha: 4
  lora_dropout: 0.0
  lora_layers: [27]
  lora_modules: [q_proj, v_proj]
  trainable_tangent_parameters: lora_B_only

oracle:
  model: Skywork/Skywork-Reward-V2-Llama-3.2-3B
  revision: beafe5f2e6a275ce8c556f68f2d82de7fefbc3d8
  dtype: float32
  transform: train_median_scaled_mad_affine
  robust_scale_floor: 1.0e-6
  batch_size: 16

reward_model:
  model: Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  dtype: float32
  parameterization: frozen_backbone_linear_head
  feature_pooling: last_response_token
  linear_head_bias: false
  mle:
    objective: exact_soft_btl_nll
    optimizer: lbfgs
    max_iterations: 200
    history_size: 20
    gradient_tolerance: 1.0e-7
    change_tolerance: 1.0e-12
    microbatch_size: 256
  pro:
    objective: fisher_weighted_reward_moment_error
    solver: nested_matrix_free_cg
    max_iterations: 1536
    tolerance: 1.0e-6
    residual_recompute_interval: 20

geometry:
  fisher_estimator: raw_second_moment
  damping_relative_to_mean_diagonal: 1.0e-3
  solve_dtype: float64
  cg_tolerance: 1.0e-5
  cg_max_iterations: 7168
  residual_recompute_interval: 20

policy_update:
  method: one_step_damped_ngd_lora_b
  reward_sources: [mle_rm, pro_rm, oracle]
  beta_grid: [1.0, 2.0, 4.0]
  kl_orientation: updated_to_reference
  save_adapters: true

evaluation:
  validation_usage: diagnostics_only
  reward_fit_metrics:
    [pair_kl, soft_btl_nll, probability_mse, pairwise_accuracy, centered_reward_nmse]
  local_policy_metrics:
    [local_regret, fisher_cosine, local_target_utility, tabular_optimal_utility, tabular_regret]
  rollout:
    prompts: 512
    responses_per_prompt: 4
    metrics:
      [oracle_reward, reward_improvement, forward_kl, regularized_utility,
       utility_improvement, oracle_ngd_regret]
