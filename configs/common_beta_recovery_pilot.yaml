schema_version: prorm-common-beta-recovery-config/v1

design:
  name: common-beta-recovery-pilot-v1
  stage: pilot
  pilot_phase: calibration
  formal_eligibility: false
  evidence_role: pilot_design_selection_only
  pilot_results_permanently_excluded_from_confirmatory: true
  source_config: configs/common_beta_pilot_base.yaml
  source_config_hash: 81ccbd3bc9d745d3792d1834116ba2480d34a7201d6f4e463a61d8d8ab0baefa
  predecessor_config: configs/main.yaml
  predecessor_config_hash: ae5d628ee47ff74a1fa2b89478c40b4fdd289935d8cf58dcbcf98b42f69a0df6
  predecessor_evidence_role: exploratory_audit_only
  estimand: fixed_beta_downstream_policy_regret

run:
  seeds:
    - 20260801
    - 20260802
    - 20260803
  num_prompts: 2048
  split_sizes: {train: 1536, validation: 256, test: 256}
  confirmatory: false
  formal_eligibility: false
  excluded_from_confirmatory_evidence: true

data:
  prompt_dataset: allenai/multipref
  prompt_revision: 12910233a0238a997ebe425656e9dfed7b0ff031
  num_candidates: 4
  prompt_eligibility: policy_chat_template_tokens_lte_max_prompt_tokens_before_seeded_shuffle

policy:
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  dtype: float32
  max_prompt_tokens: 1024
  max_response_tokens: 256
  sampling:
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    min_new_tokens: 0
    repetition_penalty: 1.0
  lora_rank: 4
  lora_alpha: 4
  lora_dropout: 0.0
  lora_layers: [20, 21, 22, 23]
  lora_modules: [q_proj, v_proj]
  trainable_tangent_parameters: lora_B_only
  fixed_lora_a:
    mode: frozen_global
    initialization_seed: 946081152281754541
    expected_sha256: a2b5804109396f76b96cde98d1e2060f175a47724b1ca9fef317c7a10cb9a838
    source_seed: 20260722
    source_named_stream: policy_lora_a
    source_config: configs/main.yaml
    source_config_hash: ae5d628ee47ff74a1fa2b89478c40b4fdd289935d8cf58dcbcf98b42f69a0df6
    source_artifact_metadata_sha256: 8ec7ca893a7c93d4bbfac0b71b829b37ec63af3ca0c7a9496465ed60815b155f
    source_seed_excluded_from_phase2: true

oracle:
  model: Skywork/Skywork-Reward-V2-Qwen3-0.6B
  revision: 8c14a4e9e6321deaf572544339b16b8d6bbe8886
  dtype: float32
  transform: robust_center_scale_then_tanh
  robust_scale: scaled_mad
  robust_scale_floor: 1.0e-6
  probability_floor: 0.25
  transform_calibration:
    mode: frozen_global
    b: -4.500244140625
    tau: 2.7715682983398438
    aggregation_rule: componentwise_median
    source_split: train
    source_config: configs/main.yaml
    source_config_hash: ae5d628ee47ff74a1fa2b89478c40b4fdd289935d8cf58dcbcf98b42f69a0df6
    source_seeds_excluded_from_phase2: true
    source_artifacts:
      - seed: 20260722
        metadata_sha256: 8ec7ca893a7c93d4bbfac0b71b829b37ec63af3ca0c7a9496465ed60815b155f
      - seed: 20260723
        metadata_sha256: 4dcd84ba5be64ac7ddc0c8f6caee43ed857e2d735273382e26c388184d2991c8
      - seed: 20260724
        metadata_sha256: 84b9d89fa76555e34c7e3fa840a2873e32b91f1378991a2a3f2cf9fa42c7451d
      - seed: 20260725
        metadata_sha256: 5061881856516d61dcb20bac8a9240aacbf6300f1d6d136fb1f15258e2b0078a
      - seed: 20260726
        metadata_sha256: fdf8b717f7360ba3019ef56af56d07bfe6ee00d6d9aff2836fbf7f249f201b97

annotations:
  scheme: geometric_randomized_truncation
  gamma: 0.9
  independent_replicates_per_edge: 4
  replicate_reduction: arithmetic_mean
  prohibit_clipping: true
  bt_label_use: all_underlying_bernoulli_labels
  replicate_rng: single_named_generator_sequential_independent_draws_with_preserved_boundaries
  decision_gates:
    action: fail_closed
    require_all:
      - exactly_four_replicate_boundaries
      - single_generator_initial_final_state_and_draw_count
      - replicate_tensor_hashes_preserve_boundaries
      - no_label_clipping
      - bt_uses_all_raw_bernoulli_labels
      - prorm_uses_arithmetic_mean_of_four_unclipped_estimators

reward_model:
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  dtype: float32
  parameterization: frozen_backbone_linear_head
  feature_pooling: last_response_token
  linear_head_bias: false
  outer_steps: 720
  refresh_dual_every_steps: 1
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 0.0
  microbatch_size: 64
  max_grad_norm: 1.0
  optimizer_protocol:
    schema_version: deterministic-adamw-lr-decay-recovery/v1
    one_time_recovery: true
    scope: every_phase2_first_order_convergence_trainer
    initialization: exact_zero_head_and_fresh_optimizer_state
    learning_rate_schedule:
      update_indexing: one_indexed_inclusive
      application: set_learning_rate_immediately_before_optimizer_update
      stages:
        - {first_update: 1, last_update: 5760, learning_rate: 1.0e-3}
        - {first_update: 5761, last_update: 6760, learning_rate: 3.0e-4}
        - {first_update: 6761, last_update: 8760, learning_rate: 1.0e-4}
        - {first_update: 8761, last_update: 10760, learning_rate: 3.0e-5}
        - {first_update: 10761, last_update: 12760, learning_rate: 1.0e-5}
      schedule_sha256: 46e0b0fdc70c507b0325c445068326ba7bc30326d70b65fa33803cc3c876c216
    legacy_constant_lr_boundary_snapshot_steps: 5760
    state_transition: preserve_all_adamw_moments_across_learning_rate_boundaries
    adamw:
      betas: [0.9, 0.999]
      eps: 1.0e-8
      amsgrad: false
      maximize: false
      foreach: false
      fused: false
      capturable: false
      differentiable: false
    reward_head_dtype: float32
    first_order_audit_dtype: float64
    microbatch_order: canonical_edge_order_contiguous_ascending_no_shuffle
    optimizer_state_reset_at_lr_milestone: false
    one_optimizer_update_per_step: true
    tie_break: exact_zero_initialized_deterministic_adamw_lr_decay_path
    validation_or_test_selection: false
  adaptive_convergence:
    relative_gradient_ratio_tolerance: 1.0e-3
    minimum_steps: 100
    maximum_steps: 12760
    check_interval_steps: 20
    consecutive_passing_checks: 3
    compute_matched_checkpoint_steps: 720
    gradient_measurement: post_update_full_data_unclipped
    denominator: exact_zero_initialization_gradient_l2_norm
    denominator_floor: 1.0e-30
    prorm_pcg_audit_initialization: cold_start_zero
    fail_closed: true
    solution_tie_break: exact_zero_initialized_deterministic_adamw_lr_decay_path
    unique_solution_claim: false
    validation_or_test_selection: false
    primary_heads_required_to_converge: [bt_mle, prorm_plus]
  identifiability:
    design_matrix: reward_feature_difference_design_matrix
    split: train
    relative_rank_tolerance: 1.0e-10
    role: pilot_measure_only
    require_full_column_rank: false
    algorithmic_tie_break: exact_zero_initialized_deterministic_adamw_lr_decay_path
    minimum_norm_claim: false
    confirmatory_freeze_requirement: decide_gate_from_train_only_pilot_then_issue_new_identity

objective:
  common_beta:
    calibration_split: train
    calibration_source: transformed_operational_oracle
    rule: pilot_seed_candidate_from_oracle_train_fisher_quadratic_for_future_global_beta
    frozen_global_beta: null
    beta_source_aggregate_sha256: null
    primary_k_cal: 0.003
    sensitivity_k_cal: [0.001, 0.01]
    sensitivity_frozen_global_beta_multipliers: null
    primary_execution_role: pilot_global_beta_calibration_candidate
    sensitivity_execution_role: required_separate_global_beta_candidate_sensitivity
    sensitivity_executed_separately: true
    sensitivity_eligible_for_primary_claim: false
    shared_by: [bt_mle, prorm_plus, oracle_step]
    learner_specific_line_search: false
    learner_specific_norm_rescaling: false
    post_evaluation_retuning: false
  full_tangent:
    kind: full_fixed_a_lora_b
    ridge:
      enabled: true
      rule: relative_to_mean_fisher_diagonal
      relative_coefficient: 0.001
      sensitivity_multipliers: [0.1, 1.0, 10.0]
      primary_execution_role: pilot_candidate_primary
      sensitivity_execution_role: required_separate_pilot_sensitivity
      sensitivity_executed_separately: true
      sensitivity_eligible_for_primary_claim: false
      solver_dtype: float64
      pcg_tolerance: 1.0e-5
      pcg_max_iterations: 8192

positive_controls:
  direct_oracle_geometry:
    enabled: true
    construction: complete_pair_u_statistic_equals_node_covariance
    role: algebraic_identity_positive_control
    eligible_for_primary_claim: false
  exact_margin:
    enabled: true
    h_source: transformed_oracle_reward_difference
    role: zero_noise_mechanism_positive_control
    eligible_for_primary_claim: false
  exact_soft_label_bt:
    enabled: true
    role: noise_free_positive_control_and_secondary_misspecification_diagnostic
    noise_free: true
    input: sigmoid_of_train_transformed_oracle_margin
    eligible_for_primary_claim: false
  low_dimensional_tangent:
    enabled: true
    construction: seeded_orthonormal_projection
    dimension: 256
    seed_namespace: prorm-common-beta-low-dimensional-tangent-v1
    regularization: moore_penrose_pseudoinverse
    relative_eigenvalue_tolerance: 1.0e-10
    eligible_for_primary_claim: false
  numeric_gate_tolerances:
    direct_identity_absolute_error: 1.0e-10
    direct_identity_relative_error: 1.0e-10
    objective_binding_relative_error: 2.0e-5
    objective_binding_absolute_error: 2.0e-7
    outer_relative_gradient_ratio: 1.0e-3
    low_dimensional_orthonormality_max_absolute_error: 1.0e-10
    low_dimensional_pseudoinverse_relative_residual: 1.0e-6
    low_dimensional_scatter_max_absolute_error: 1.0e-4
    low_dimensional_score_identity_max_absolute_error: 1.0e-4
  decision_gates:
    action: fail_closed
    unit: per_seed
    require_all:
      - direct_oracle_moment_identity
      - exact_margin_objective_decrease
      - exact_margin_first_order_convergence
      - low_dimensional_exact_rank
      - low_dimensional_orthonormality
      - low_dimensional_pseudoinverse_residual
      - low_dimensional_scatter_identity
      - low_dimensional_score_identity
      - all_required_pcg_solves_converged

arms:
  zero_b:
    direction: zero
    uses_common_beta: false
    role: reference
  bt_mle:
    direction: bt_train_natural_direction
    uses_common_beta: true
    role: learner
  prorm_plus:
    direction: prorm_plus_train_natural_direction
    uses_common_beta: true
    role: learner
  oracle_step:
    direction: oracle_train_natural_direction
    uses_common_beta: true
    role: positive_control

evaluation:
  rollout_candidates_per_prompt: 4
  primary_endpoint: operational_oracle_reward_minus_beta_common_on_policy_kl
  endpoints:
    heldout_local_regret:
      split: test
      metric: local_regret_at_frozen_global_beta
      contrast: bt_mle_minus_prorm_plus
      direction: higher_is_better
    finite_policy_utility:
      split: test
      metric: operational_oracle_reward_minus_beta_common_on_policy_kl
      contrast: prorm_plus_minus_bt_mle
      direction: higher_is_better
  primary_kl:
    orientation: updated_to_reference
    trajectories: updated_policy
    token_reduction: sum_per_sequence
    candidate_reduction: mean_within_prompt
  secondary_kl:
    orientation: reference_to_updated
    trajectories: fixed_reference
    role: diagnostic_only
  safety:
    mean_policy_to_reference_kl_cap: 0.02
    prompt_mean_p95_kl_cap: 0.02
    prompt_mean_p99_kl_cap: 0.05
    prompt_mean_maximum_kl_cap: 0.10
    per_sequence_maximum_kl_cap: 0.20
    action: fail_closed
    retune_beta_on_violation: false
  experimental_unit: seed
  paired_bootstrap_resamples: 10000
  paired_bootstrap_seed: 20260801
  seed_level_interval:
    method: paired_seed_percentile_bootstrap
    confidence_level: 0.95
    interval_sidedness: two_sided
    effective_component_one_sided_alpha: 0.025
    lower_bound_rule: strictly_greater_than_zero
    prompt_rows_used_as_independent_replicates: false
    estimand: rng_expectation_of_paired_contrast_conditioned_on_frozen_prompt_pool_models_oracle_and_design
    test_structure: intersection_union_single_conjunctive_claim
    component_null: mean_paired_contrast_lte_zero
    component_alternative: mean_paired_contrast_gt_zero
    multiplicity_adjustment: none_for_intersection_union_conjunctive_claim
  decision_gates:
    application: pilot_calibration_target_free_selection
    supports_formal_claim: false
    require_all:
      - heldout_bt_minus_prorm_plus_interval_lower_positive
      - finite_prorm_plus_minus_bt_mle_interval_lower_positive
      - finite_prorm_plus_minus_zero_b_interval_lower_positive
      - finite_oracle_step_minus_zero_b_interval_lower_positive
      - all_optimization_gates_pass
      - all_positive_control_gates_pass
      - all_kl_safety_gates_pass
  max_length:
    candidate_horizon_tokens: 256
    role: pilot_horizon_selection_input
    measure_only: true
    formal_gate: false
    formal_threshold: 0.05
    allowed_horizon_sequence: [256, 512, 1024]
    horizon_grid_index: 0
    parent_pilot_aggregate_sha256: null
    previous_horizon_failed_length_gate: false
    post_pilot_requirement: issue_new_pilot_freeze_design_identity
  report_response_length_diagnostics: true

secondary_experiments:
  all_six_pairs:
    enabled: true
    construction: all_six_prompt_pairs_u_statistic
    execution_role: separate_secondary_efficiency_experiment
    executed_in_primary_four_arm_run: false
    eligible_for_primary_claim: false

recovery_control:
  schema_version: prorm-phase2-recovery-control/v1
  parent_failure_registry: configs/phase2_recovery_parent_failures.json
  parent_failure_registry_sha256: 7be4ee90b1f494d32f96214f407a57cbee54be86a77dacc1206d2acd527857dc
  optimizer_diagnostic_path: diagnostics/bt-convergence/seed-20260801-commit-791c2da.json
  optimizer_diagnostic_sha256: bd7c3d80c26500ee273b14bb1ea8bc3428f71fdb319a49c792bf4de567e2c6a9
  optimizer_diagnostic_source_git_commit: 791c2daac7f1601f6798d5878bef1770ca9d5ebf
  optimizer_diagnostic_source_job_id: "1647982"
  optimizer_diagnostic_role: train_only_nonconfirmatory_schedule_selection
  parent_phase2_design_sha256: 0c8820b67b8ca85c23cd5c31b8d25001018b31a7271f6a861d88cfae2f85d7ca
  parent_source_job_array_id: "1647491"
  parent_seeds: [20260801, 20260802, 20260803]
  parent_terminal_status: FAILED
  parent_failure_aggregate_present: false
  parent_failure_evidence: exact_three_seed_registry_binds_each_failed_terminal_and_phase2_run_log
  artifact_reuse: immutable_parent_materialization_only
  artifact_producer_identity_separate_from_recovery_training_identity: true
  execution_scope: train_only
  policy_rollout_allowed: false
  validation_or_test_access_allowed: false
  final_oracle_allowed: false
  downstream_utility_allowed: false
  one_shot_no_further_adaptation: true
  failure_action: hard_fail_no_second_recovery
